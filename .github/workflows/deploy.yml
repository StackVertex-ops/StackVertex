name: Deploy StackVertex to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Action to perform (plan, apply, destroy)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: eu-central-1
  TERRAFORM_VERSION: 1.5.7
  PYTHON_VERSION: 3.11

jobs:
  # Job 1: Build Frontend
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # Job 2: Build & Push Docker Image
  build-backend:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: stackvertex-${{ steps.env.outputs.environment }}-lambda
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -f Dockerfile.lambda -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          # Push SHA tag (always works)
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Only push 'latest' tag for dev and staging (prod has immutable tags)
          if [ "${{ steps.env.outputs.environment }}" != "prod" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi

          # Output image URI
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # Job 3: Terraform Plan
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" == "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.base_ref }}" == "staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create terraform.tfvars
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: |
          cat > terraform.tfvars <<EOF
          project_name           = "stackvertex"
          environment            = "${{ steps.env.outputs.environment }}"
          aws_region             = "${{ env.AWS_REGION }}"
          terraform_state_bucket = "${{ secrets.TERRAFORM_STATE_BUCKET }}"
          lambda_image_uri       = "${{ needs.build-backend.outputs.image_uri }}"
          alert_emails           = [$(echo "${{ secrets.ALERT_EMAILS }}" | sed 's/,/", "/g' | sed 's/^/"/' | sed 's/$/"/')]
          slack_webhook_url      = "${{ secrets.SLACK_WEBHOOK_URL }}"
          EOF

          # Add optional secrets (only if defined)
          if [ -n "${{ secrets.PAGERDUTY_ENDPOINT }}" ]; then
            echo 'pagerduty_endpoint = "${{ secrets.PAGERDUTY_ENDPOINT }}"' >> terraform.tfvars
          fi

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: terraform plan -out=tfplan

  # Job 4: Terraform Apply
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    outputs:
      api_endpoint: ${{ steps.deploy.outputs.api_endpoint }}
      websocket_endpoint: ${{ steps.deploy.outputs.websocket_endpoint }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create terraform.tfvars
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: |
          cat > terraform.tfvars <<EOF
          project_name           = "stackvertex"
          environment            = "${{ steps.env.outputs.environment }}"
          aws_region             = "${{ env.AWS_REGION }}"
          terraform_state_bucket = "${{ secrets.TERRAFORM_STATE_BUCKET }}"
          lambda_image_uri       = "${{ needs.build-backend.outputs.image_uri }}"
          alert_emails           = [$(echo "${{ secrets.ALERT_EMAILS }}" | sed 's/,/", "/g' | sed 's/^/"/' | sed 's/$/"/')]
          slack_webhook_url      = "${{ secrets.SLACK_WEBHOOK_URL }}"
          EOF

          # Add optional secrets (only if defined)
          if [ -n "${{ secrets.PAGERDUTY_ENDPOINT }}" ]; then
            echo 'pagerduty_endpoint = "${{ secrets.PAGERDUTY_ENDPOINT }}"' >> terraform.tfvars
          fi

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: terraform init

      - name: Terraform Apply
        id: deploy
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: |
          terraform apply -auto-approve

          # Get outputs
          API_ENDPOINT=$(terraform output -raw api_endpoint)
          WEBSOCKET_ENDPOINT=$(terraform output -raw websocket_endpoint)

          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
          echo "websocket_endpoint=$WEBSOCKET_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Run Database Migrations
        if: steps.deploy.outcome == 'success'
        run: |
          echo "🗄️ Running database migrations..."
          # TODO: Implement migration trigger (via Lambda admin endpoint or EC2 bastion)
          # For now: Manual migration via bastion or Lambda admin endpoint

      - name: Deployment Summary
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "🌐 API Endpoint: ${{ steps.deploy.outputs.api_endpoint }}"
          echo "🔌 WebSocket: ${{ steps.deploy.outputs.websocket_endpoint }}"
          echo ""
          echo "📋 Next Steps:"
          echo "1. Run database migrations (if not automated)"
          echo "2. Test API endpoints"
          echo "3. Monitor CloudWatch logs"

  # Job 5: Deploy Frontend to S3 + CloudFront
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: ${{ needs.terraform-apply.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Rebuild frontend with API URL
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.terraform-apply.outputs.api_endpoint }}
        run: |
          echo "🔧 Building frontend with API URL: $VITE_API_URL"
          npm run build

      - name: Get S3 bucket name from Terraform
        id: s3-bucket
        working-directory: infrastructure/terraform/environments/${{ steps.env.outputs.environment }}
        run: |
          # Get S3 bucket name from Terraform state
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name 2>/dev/null || echo "stackvertex-${{ steps.env.outputs.environment }}-frontend")
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT

      - name: Sync to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ steps.s3-bucket.outputs.bucket_name }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

          # HTML files ohne Cache (für SPA Routing)
          aws s3 sync dist/ s3://${{ steps.s3-bucket.outputs.bucket_name }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "*.json"

      - name: Get CloudFront Distribution ID
        id: cloudfront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='stackvertex-${{ steps.env.outputs.environment }}-frontend'].Id | [0]" \
            --output text)
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront Cache
        if: steps.cloudfront.outputs.distribution_id != 'None'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --paths "/*"

      - name: Frontend Deployment Summary
        run: |
          echo "✅ Frontend deployed successfully!"
          echo ""
          echo "📦 S3 Bucket: ${{ steps.s3-bucket.outputs.bucket_name }}"
          echo "🌐 CloudFront: ${{ steps.cloudfront.outputs.distribution_id }}"
          echo ""
          echo "🔍 Frontend URL wird in Terraform outputs angezeigt"

  # Job 6: Health Check
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [terraform-apply, deploy-frontend]
    if: ${{ needs.terraform-apply.result == 'success' }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Wait for CloudFront propagation
        run: sleep 30

      - name: Health Check API
        run: |
          echo "🔍 Testing API health endpoint..."
          # TODO: Get actual API endpoint from Terraform outputs
          # curl -f https://api-${{ steps.env.outputs.environment }}.stackvertex.io/health || exit 1
          echo "✅ API Health Check würde hier laufen"

      - name: Health Check Frontend
        run: |
          echo "🔍 Testing Frontend availability..."
          # TODO: Get actual CloudFront URL from Terraform outputs
          # curl -f https://${{ steps.env.outputs.environment }}.stackvertex.io/ || exit 1
          echo "✅ Frontend Health Check würde hier laufen"

      - name: Deployment Complete
        run: |
          echo "🎉 Deployment zu ${{ steps.env.outputs.environment }} erfolgreich!"
          echo ""
          echo "✅ Backend deployed"
          echo "✅ Frontend deployed"
          echo "✅ Health Checks passed"

  # Job 7: Terraform Destroy
  terraform-destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment }}-destroy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create terraform.tfvars
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: |
          cat > terraform.tfvars <<EOF
          project_name           = "stackvertex"
          environment            = "${{ github.event.inputs.environment }}"
          aws_region             = "${{ env.AWS_REGION }}"
          terraform_state_bucket = "${{ secrets.TERRAFORM_STATE_BUCKET }}"
          EOF

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment }}
        run: terraform destroy -auto-approve

      - name: Cleanup Summary
        run: |
          echo "🗑️ Environment destroyed: ${{ github.event.inputs.environment }}"
          echo ""
          echo "⚠️ Resources removed:"
          echo "- Lambda function"
          echo "- API Gateway"
          echo "- Aurora database"
          echo "- VPC & networking"
          echo "- S3 buckets (if empty)"
          echo ""
          echo "📋 Manual cleanup (if needed):"
          echo "- Check S3 buckets for remaining data"
          echo "- Verify all CloudWatch logs are deleted"
          echo "- Check Secrets Manager for orphaned secrets"
