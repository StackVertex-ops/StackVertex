<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Verwaltung - OverCloud Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --dark: #1a1a2e;
            --gray: #6b7280;
            --light-gray: #f3f4f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--light-gray);
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            font-family: monospace;
        }

        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .faq-item {
            background: var(--light-gray);
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 1rem;
            cursor: move;
        }

        .faq-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .faq-item h4 {
            font-size: 1rem;
            color: var(--dark);
            flex: 1;
        }

        .faq-item-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        .faq-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-published {
            background: var(--success);
            color: white;
        }

        .badge-draft {
            background: var(--warning);
            color: white;
        }

        .category-filter {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--gray);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            font-size: 1.5rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/admin.html" class="back-link">← Zurück zum Admin</a>
        <h1>FAQ Verwaltung</h1>
    </header>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="stat-total">-</h3>
                <p>Gesamt FAQs</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-published">-</h3>
                <p>Veröffentlicht</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-drafts">-</h3>
                <p>Entwürfe</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-views">-</h3>
                <p>Gesamt Views</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-grid">
            <!-- FAQ Liste -->
            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>FAQs</h2>
                    <button class="btn btn-primary" onclick="openCreateModal()">+ Neues FAQ</button>
                </div>

                <!-- Category Filter -->
                <div class="category-filter" id="category-filter">
                    <!-- Dynamisch befüllt -->
                </div>

                <!-- FAQ Liste -->
                <div id="faq-list" class="faq-list">
                    <div class="loading">Lade FAQs...</div>
                </div>
            </div>

            <!-- Kategorien -->
            <div class="panel">
                <h2>Kategorien</h2>
                <button class="btn btn-primary btn-sm" onclick="openCategoryModal()" style="margin-bottom: 1rem;">+ Neue Kategorie</button>

                <div id="categories-list">
                    <div class="loading">Lade Kategorien...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit FAQ Modal -->
    <div id="faq-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Neues FAQ</h3>
                <button class="close-modal" onclick="closeFaqModal()">×</button>
            </div>
            <form id="faq-form">
                <div id="modal-message"></div>

                <div class="form-group">
                    <label for="faq-category">Kategorie</label>
                    <select id="faq-category" required>
                        <!-- Dynamisch befüllt -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="faq-question">Frage</label>
                    <input type="text" id="faq-question" required minlength="5" maxlength="500">
                </div>

                <div class="form-group">
                    <label for="faq-answer">Antwort (Markdown unterstützt)</label>
                    <textarea id="faq-answer" required minlength="10"></textarea>
                    <small style="color: var(--gray);">Markdown: **fett**, *kursiv*, `code`, [Link](url), - Liste</small>
                </div>

                <div class="form-group">
                    <label for="faq-status">Status</label>
                    <select id="faq-status">
                        <option value="draft">Entwurf</option>
                        <option value="published">Veröffentlicht</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Speichern</button>
                    <button type="button" class="btn btn-secondary" onclick="closeFaqModal()">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Neue Kategorie</h3>
                <button class="close-modal" onclick="closeCategoryModal()">×</button>
            </div>
            <form id="category-form">
                <div id="category-modal-message"></div>

                <div class="form-group">
                    <label for="category-name">Name</label>
                    <input type="text" id="category-name" required minlength="2" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="category-slug">Slug (URL-sicher)</label>
                    <input type="text" id="category-slug" required minlength="2" maxlength="50" pattern="[a-z0-9-]+">
                    <small style="color: var(--gray);">Nur Kleinbuchstaben, Zahlen und Bindestriche</small>
                </div>

                <div class="form-group">
                    <label for="category-icon">Icon (Emoji)</label>
                    <input type="text" id="category-icon" maxlength="10" placeholder="📌">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Speichern</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script type="module" src="./js/pages/admin-faq.js"></script>
</body>
</html>
