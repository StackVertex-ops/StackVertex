<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure Designer - OverCloud</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm h-16 flex items-center px-6 border-b border-gray-200">
        <div class="flex items-center gap-3">
            <a href="/index.html" class="text-gray-600 hover:text-gray-900">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <h1 class="text-2xl font-bold text-gray-900">Infrastructure Designer</h1>
            <span class="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded">Beta</span>
        </div>

        <div class="ml-auto flex items-center gap-3">
            <!-- Toolbar Buttons -->
            <button id="autoLayoutBtn" class="btn btn-secondary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                Auto Layout
            </button>

            <button id="fitBtn" class="btn btn-secondary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                Fit to View
            </button>

            <button id="exportImageBtn" class="btn btn-secondary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Export Image
            </button>

            <div class="h-6 w-px bg-gray-300"></div>

            <button id="deleteBtn" class="btn btn-secondary text-sm text-red-600 hover:bg-red-50">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Delete Selected
            </button>

            <button id="validateBtn" class="btn btn-secondary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Validate
            </button>

            <button id="generateTerraformBtn" class="btn btn-secondary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
                Generate Terraform
            </button>

            <button id="saveBtn" class="btn btn-primary text-sm">
                <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                </svg>
                Save Architecture
            </button>
        </div>
    </header>

    <!-- Main Designer Layout -->
    <div class="designer-layout">
        <!-- Canvas Area (Top 60%) -->
        <div class="canvas-area">
            <!-- Component Palette (Left Sidebar) -->
            <div id="component-palette" class="bg-white border-r border-gray-200 p-4 overflow-y-auto">
                <!-- Filled by ComponentPalette.js -->
            </div>

            <!-- Canvas (Right) -->
            <div id="canvas-container">
                <!-- Filled by Cytoscape.js -->
            </div>
        </div>

        <!-- Configuration Tabs Area (Bottom 40%) -->
        <div class="tabs-area">
            <div id="configuration-tabs" class="h-full">
                <!-- Tabs System -->
                <div class="tabs-container h-full flex flex-col">
                    <!-- Tab Headers -->
                    <div class="tabs-header border-b border-gray-200 bg-white px-4 pt-3 flex gap-2 overflow-x-auto">
                        <div id="tab-headers" class="flex gap-2">
                            <!-- Tabs dynamically added here -->
                        </div>
                    </div>

                    <!-- Tab Content -->
                    <div id="tab-content" class="flex-1 overflow-y-auto bg-gray-50 p-6">
                        <div class="max-w-4xl mx-auto">
                            <div class="text-center text-gray-500 py-12">
                                <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <p class="text-lg font-medium mb-2">Keine Komponente ausgewählt</p>
                                <p class="text-sm">Klicke auf eine Komponente im Canvas oder ziehe eine neue aus der Palette</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/pages/infrastructure-designer.js"></script>
</body>
</html>
