[tool.poetry]
name = "stackvertex-backend"
version = "0.1.0"
description = "StackVertex Backend - The apex of your cloud stack"
authors = ["AndySchw <schwarz23andy@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.135.1,<0.136.0"
uvicorn = ">=0.42.0,<0.43.0"
pydantic = ">=2.12.5,<3.0.0"
boto3 = ">=1.42.73,<2.0.0"
pydantic-settings = ">=2.13.1,<3.0.0"
psycopg2-binary = ">=2.9.11,<3.0.0"
sqlalchemy = ">=2.0.48,<3.0.0"
alembic = ">=1.18.4,<2.0.0"
python-jose = ">=3.5.0,<4.0.0"
passlib = ">=1.7.4,<2.0.0"
bcrypt = ">=4.0.0,<5.0.0"
python-multipart = ">=0.0.22,<0.0.23"
jinja2 = ">=3.1.6,<4.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
jsonschema = ">=4.23.0,<5.0.0"
mangum = ">=0.18.0,<0.19.0"
boto3-stubs = {extras = ["dynamodb", "s3"], version = ">=1.42.73,<2.0.0"}
email-validator = "^2.3.0"
slowapi = "^0.1.9"
stripe = "^15.1.0"
python-json-logger = "^3.2.1"
watchtower = {version = "^3.3.1", optional = true}
sentry-sdk = {version = "^2.21.0", extras = ["fastapi"], optional = true}

[tool.poetry.extras]
cloudwatch = ["watchtower"]
sentry = ["sentry-sdk"]
monitoring = ["watchtower", "sentry-sdk"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
black = ">=26.5.1,<27.0.0"
ruff = ">=0.15.16,<0.16.0"
mypy = ">=1.19.1,<2.0.0"
httpx = ">=0.28.1,<0.29.0"
moto = {extras = ["dynamodb", "s3"], version = "^5.2.2"}
freezegun = "^1.5.5"
bandit = {extras = ["toml"], version = "^1.9.4"}
safety = "^3.8.1"
detect-secrets = "^1.5.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
skips = ["B101"]  # Skip assert warnings in tests
tests = ["B201", "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308", "B309", "B310", "B311", "B312", "B313", "B314", "B315", "B316", "B317", "B318", "B319", "B320", "B321", "B323", "B324", "B325", "B401", "B402", "B403", "B404", "B405", "B406", "B407", "B408", "B409", "B410", "B411", "B412", "B413", "B501", "B502", "B503", "B504", "B505", "B506", "B507", "B601", "B602", "B603", "B604", "B605", "B606", "B607", "B608", "B609", "B610", "B611", "B701", "B702", "B703"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: Integration tests requiring external services",
    "unit: Fast unit tests",
]
